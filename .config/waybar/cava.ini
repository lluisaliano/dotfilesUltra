[general]
framerate = 30
bars = 16
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 5

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 77
